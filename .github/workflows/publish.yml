name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Use the one-time NPM_BOOTSTRAP_TOKEN secret for the first publication
        type: boolean
        default: false
      verify_only:
        description: Verify the manifest version on npm without publishing (may run on main)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require a version tag matching package.json
        if: ${{ !inputs.verify_only }}
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
            if (process.env.RELEASE_REF !== 'refs/tags/v' + version) {
              throw new Error('Run this workflow on the matching v' + version + ' tag, not a branch.');
            }
          "
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Publish with trusted publishing
        if: ${{ !inputs.verify_only && !inputs.bootstrap }}
        run: npm publish .artifacts/amitport-react-scrollytelling-$(node -p "require('./package.json').version").tgz --access public
      - name: Bootstrap the first publication
        if: ${{ !inputs.verify_only && inputs.bootstrap }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "::error::Set NPM_BOOTSTRAP_TOKEN in repository Actions secrets first."; exit 1; }
          test "$(npm whoami)" = amitport || { echo "::error::Bootstrap token must belong to npm user amitport."; exit 1; }
          npm publish .artifacts/amitport-react-scrollytelling-$(node -p "require('./package.json').version").tgz --access public --provenance
      - name: Verify the published version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for ATTEMPT in 1 2 3 4 5 6; do
            if npm view "@amitport/react-scrollytelling@$VERSION" version dist.integrity --registry=https://registry.npmjs.org; then
              exit 0
            fi
            if [ "$ATTEMPT" -lt 6 ]; then
              echo "::warning::Registry lookup failed (attempt $ATTEMPT/6); retrying in 20 seconds."
              sleep 20
            fi
          done
          echo "::error::Published version could not be verified. Do not republish; investigate and run with verify_only."
          exit 1
